<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges — DLS Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --pitch: #0d1b2a; --turf: #112240; --line: #1e3a5f; --mist: #8892b0; --ice: #ccd6f6; --lime: #b5ff47; --coral: #ff6b6b; --gold: #ffd700; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--pitch); color: var(--ice); min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--pitch); }
    ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 2px; }

    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(13,27,42,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .logo { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.1rem; background: linear-gradient(135deg,var(--ice),var(--lime)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav a { color: var(--mist); text-decoration: none; font-size: .8rem; font-weight: 500; transition: color .2s; }
    .nav a:hover { color: var(--lime); }

    .hero { padding: 90px 20px 30px; text-align: center; background: linear-gradient(180deg,var(--pitch),#0f2540,var(--pitch)); }
    .hero h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 900; background: linear-gradient(135deg,var(--ice),var(--lime)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--mist); font-size: .85rem; margin: 6px auto 16px; max-width: 400px; }

    .stats { max-width: 700px; margin: -8px auto 0; padding: 0 16px; display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .stat-box { background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
    .stat-box .num { font-size: 1.3rem; font-weight: 800; color: var(--lime); }
    .stat-box .label { font-size: .6rem; text-transform: uppercase; letter-spacing: .5px; color: var(--mist); margin-top: 3px; font-weight: 600; }

    .section { max-width: 700px; margin: 0 auto; padding: 24px 16px 10px; }
    .section h2 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .btn-lime { background: var(--lime); color: #000; padding: 8px 20px; border-radius: 10px; font-weight: 700; font-size: .8rem; cursor: pointer; transition: all .2s; border: none; font-family: 'Inter', sans-serif; }
    .btn-lime:hover { opacity: .85; transform: translateY(-1px); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ice); padding: 8px 20px; border-radius: 10px; font-weight: 600; font-size: .8rem; cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif; }
    .btn-ghost:hover { border-color: var(--lime); color: var(--lime); }

    .card { background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 10px; transition: all .2s; }
    .card:hover { border-color: rgba(181,255,71,.15); }
    .card .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card .teams { font-weight: 700; font-size: .95rem; color: var(--ice); }
    .card .teams .vs { color: var(--mist); font-weight: 400; font-size: .75rem; margin: 0 4px; }
    .card .bet { font-weight: 800; color: var(--gold); font-size: .9rem; }
    .card .meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .7rem; color: var(--mist); flex-wrap: wrap; }
    .card .status { padding: 2px 10px; border-radius: 50px; font-size: .65rem; font-weight: 600; text-transform: uppercase; }
    .status.open { background: rgba(181,255,71,.1); color: var(--lime); }
    .status.ongoing { background: rgba(255,215,0,.1); color: var(--gold); }
    .status.completed { background: rgba(99,102,241,.1); color: #818cf8; }
    .status.disputed { background: rgba(255,107,107,.1); color: var(--coral); }

    .empty { text-align: center; padding: 40px 20px; color: var(--mist); border: 1px dashed var(--line); border-radius: 14px; }
    .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; padding: 16px; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-inner { background: var(--turf); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: 100%; max-width: 400px; transform: scale(.95); transition: transform .25s; }
    .modal.open .modal-inner { transform: scale(1); }
    .modal-inner h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .7rem; font-weight: 600; color: var(--mist); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 14px; border-radius: 10px; font-size: .85rem; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ice); outline: none; font-family: 'Inter', sans-serif; transition: border-color .2s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--lime); }
    .field textarea { resize: vertical; min-height: 60px; }
    .close-modal { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--mist); font-size: 1.2rem; cursor: pointer; }

    .upload-area { border: 2px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all .2s; margin-top: 8px; }
    .upload-area:hover { border-color: var(--lime); background: rgba(181,255,71,.03); }
    .upload-area input { display: none; }

    footer { text-align: center; padding: 18px; color: var(--mist); font-size: .7rem; border-top: 1px solid var(--line); margin-top: 30px; }
    footer a { color: var(--lime); text-decoration: none; font-weight: 500; }

    @media (max-width: 640px) { .hero h1 { font-size: 1.5rem; } .stats { grid-template-columns: repeat(3,1fr); gap: 6px; } .stat-box .num { font-size: 1.1rem; } }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="logo">⚽ DLS Hub</span>
    <div style="display:flex;gap:14px;align-items:center">
      <a href="index.html">Home</a>
      <span style="color:var(--lime);font-size:.75rem;font-weight:600">Challenges</span>
    </div>
  </nav>

  <section class="hero">
    <h1>⚔️ Challenges</h1>
    <p>Challenge other players, bet DLS points, prove who&#39;s the best</p>
  </section>

  <div class="stats">
    <div class="stat-box"><div class="num" id="statActive">0</div><div class="label">Active</div></div>
    <div class="stat-box"><div class="num" id="statCompleted">0</div><div class="label">Completed</div></div>
    <div class="stat-box"><div class="num" id="statTotal">0</div><div class="label">Total Bets</div></div>
  </div>

  <div class="section">
    <h2>
      <span>⚔️ All Challenges</span>
      <button class="btn-lime" onclick="openModal('create')">+ New Challenge</button>
    </h2>
    <div id="list"></div>
  </div>

  <footer>
    <p>&copy; 2026 DLS Hub — <a href="https://github.com/Randyblazedev" target="_blank">RandyBlazedev</a></p>
  </footer>

  <!-- Create Challenge Modal -->
  <div class="modal" id="createModal" onclick="if(event.target===this)closeModal('create')">
    <div class="modal-inner">
      <button class="close-modal" onclick="closeModal('create')" style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--mist);font-size:1.2rem;cursor:pointer">✕</button>
      <h3>⚔️ New Challenge</h3>
      <div class="field"><label>Your Team Name</label><input type="text" id="fMyTeam" placeholder="e.g. FC Blaze"></div>
      <div class="field"><label>Opponent Username</label><input type="text" id="fOpponent" placeholder="e.g. Player2"></div>
      <div class="field"><label>Opponent Team Name</label><input type="text" id="fOppTeam" placeholder="e.g. Thunder FC"></div>
      <div class="field"><label>Bet Amount (Points)</label><input type="number" id="fBet" placeholder="500" value="500"></div>
      <div class="field"><label>Rules (optional)</label><textarea id="fRules" placeholder="e.g. 5 min match, no fouls..."></textarea></div>
      <button class="btn-lime" style="width:100%;padding:12px" onclick="createChallenge()">⚔️ Issue Challenge</button>
    </div>
  </div>

  <!-- Upload Screenshot Modal -->
  <div class="modal" id="ssModal" onclick="if(event.target===this)closeModal('ss')">
    <div class="modal-inner">
      <button class="close-modal" onclick="closeModal('ss')" style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--mist);font-size:1.2rem;cursor:pointer">✕</button>
      <h3>📸 Upload Result</h3>
      <p style="font-size:.8rem;color:var(--mist);margin-bottom:16px" id="ssInfo">Submit your match screenshot</p>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('ssInput').click()">
        <p style="font-size:2rem;margin-bottom:6px">📸</p>
        <p style="font-size:.8rem;color:var(--mist)">Click to upload screenshot</p>
        <input type="file" id="ssInput" accept="image/*" onchange="previewSS(event)">
      </div>
      <div id="ssPreview" style="display:none;margin-top:10px">
        <img id="ssImg" style="width:100%;max-height:200px;object-fit:contain;border-radius:8px;border:1px solid var(--line)">
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn-ghost" style="flex:1" onclick="closeModal('ss')">Cancel</button>
        <button class="btn-lime" style="flex:1" id="ssSubmitBtn" onclick="submitScreenshot()">Submit Result</button>
      </div>
    </div>
  </div>

  <script>
    const CHALLENGES_KEY = 'dlshub_challenges';
    let challenges = [];
    let currentChallengeId = null;
    let ssDataUrl = null;

    function load() {
      try { challenges = JSON.parse(localStorage.getItem(CHALLENGES_KEY)) || []; } catch { challenges = []; }
      if (challenges.length === 0) {
        challenges = [
          { id: 'c1', myTeam: 'FC Blaze', opponent: 'Player2', oppTeam: 'Thunder FC', bet: 1000, rules: '5 min, extra time off', status: 'open', created: Date.now() - 3600000, winner: null },
          { id: 'c2', myTeam: 'Strikers United', opponent: 'MessiFan10', oppTeam: 'Messi FC', bet: 2000, rules: '', status: 'ongoing', created: Date.now() - 7200000, winner: null },
          { id: 'c3', myTeam: 'FC Blaze', opponent: 'Legend99', oppTeam: 'Legends FC', bet: 1500, rules: 'Normal rules', status: 'completed', created: Date.now() - 86400000 * 2, winner: 'FC Blaze' },
        ];
        save();
      }
      render();
    }

    function save() { localStorage.setItem(CHALLENGES_KEY, JSON.stringify(challenges)); }

    function createChallenge() {
      const myTeam = document.getElementById('fMyTeam').value.trim();
      const opponent = document.getElementById('fOpponent').value.trim();
      const oppTeam = document.getElementById('fOppTeam').value.trim();
      const bet = parseInt(document.getElementById('fBet').value);
      const rules = document.getElementById('fRules').value.trim();

      if (!myTeam || !opponent || !bet || bet < 100) { alert('Fill all fields. Min bet: 100 points'); return; }

      challenges.push({
        id: 'ch-' + Date.now().toString(36),
        myTeam, opponent, oppTeam: oppTeam || opponent + "'s team",
        bet, rules,
        status: 'open',
        created: Date.now(),
        winner: null,
        screenshot: null
      });

      save();
      closeModal('create');
      render();
      document.getElementById('fMyTeam').value = '';
      document.getElementById('fOpponent').value = '';
      document.getElementById('fOppTeam').value = '';
      document.getElementById('fBet').value = '500';
      document.getElementById('fRules').value = '';
    }

    function render() {
      const list = document.getElementById('list');
      const sorted = [...challenges].sort((a, b) => b.created - a.created);

      document.getElementById('statActive').textContent = challenges.filter(c => c.status === 'open' || c.status === 'ongoing').length;
      document.getElementById('statCompleted').textContent = challenges.filter(c => c.status === 'completed' || c.status === 'disputed').length;
      document.getElementById('statTotal').textContent = challenges.reduce((s, c) => s + c.bet, 0).toLocaleString();

      if (sorted.length === 0) {
        list.innerHTML = '<div class="empty"><div class="icon">⚔️</div><p>No challenges yet. Create the first one!</p></div>';
        return;
      }

      list.innerHTML = sorted.map(c => {
        const timeAgo = Math.floor((Date.now() - c.created) / 3600000);
        const timeStr = timeAgo < 1 ? 'Just now' : timeAgo < 24 ? timeAgo + 'h ago' : Math.floor(timeAgo / 24) + 'd ago';
        const statusLabels = { open: '🔓 Open', ongoing: '⏳ Playing', completed: '✅ Done', disputed: '⚠️ Disputed' };
        const statusClass = c.status;

        let actions = '';
        if (c.status === 'open') {
          actions = `<button class="btn-lime" style="padding:4px 12px;font-size:.7rem" onclick="acceptChallenge('${c.id}')">Accept</button>`;
        } else if (c.status === 'ongoing') {
          actions = `<button class="btn-ghost" style="padding:4px 12px;font-size:.7rem" onclick="openSSModal('${c.id}')">📸 Submit Result</button>`;
        }

        return `
          <div class="card">
            <div class="top">
              <div class="teams">${c.myTeam} <span class="vs">vs</span> ${c.oppTeam}</div>
              <div class="bet">🪙 ${c.bet.toLocaleString()}</div>
            </div>
            <div class="meta">
              <span class="status ${statusClass}">${statusLabels[c.status] || c.status}</span>
              <span>👤 ${c.opponent}</span>
              <span>🕐 ${timeStr}</span>
              ${c.winner ? '<span>🏆 Winner: ' + c.winner + '</span>' : ''}
              ${c.rules ? '<span>📋 ' + c.rules + '</span>' : ''}
              <span style="flex:1"></span>
              ${actions}
            </div>
          </div>
        `;
      }).join('');
    }

    function acceptChallenge(id) {
      const c = challenges.find(x => x.id === id);
      if (!c) return;
      c.status = 'ongoing';
      save();
      render();
    }

    function openSSModal(id) {
      currentChallengeId = id;
      ssDataUrl = null;
      document.getElementById('ssPreview').style.display = 'none';
      document.getElementById('ssInput').value = '';
      document.getElementById('ssInfo').textContent = 'Submit result for challenge';
      document.getElementById('ssSubmitBtn').textContent = 'Submit Result';
      openModal('ss');
    }

    function previewSS(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        ssDataUrl = ev.target.result;
        document.getElementById('ssImg').src = ssDataUrl;
        document.getElementById('ssPreview').style.display = 'block';
        document.getElementById('ssInfo').textContent = '📸 Screenshot ready — submit to confirm your win';
      };
      reader.readAsDataURL(file);
    }

    function submitScreenshot() {
      if (!currentChallengeId || !ssDataUrl) { alert('Take a screenshot first!'); return; }
      const c = challenges.find(x => x.id === currentChallengeId);
      if (!c) return;

      // Ask who won
      const declaredWinner = prompt('Enter the exact name of the WINNING team (as shown on the DLS result screen):', c.myTeam);
      if (!declaredWinner || declaredWinner.trim() === '') return;

      c.status = 'completed';
      c.winner = declaredWinner.trim();
      c.screenshot = 'Stored'; // Don't store large base64 in localStorage
      c.completedAt = Date.now();
      c.resultNotes = 'Winner: ' + c.winner + ' — screenshot saved locally';
      save();
      closeModal('ss');
      render();
    }

    function openModal(m) {
      document.getElementById(m + 'Modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(m) {
      document.getElementById(m + 'Modal').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => e.key === 'Escape' && (closeModal('create'), closeModal('ss')));

    load();
  </script>
</body>
</html>
